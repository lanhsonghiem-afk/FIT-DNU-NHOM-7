<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập – MedReminder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/stylelogin.css" />
</head>

<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">💊</div>
                <span class="logo-text">MedReminder</span>
            </div>
            <div id="success-msg"
                style="display:none;background:rgba(76,175,80,0.12);border:1px solid rgba(76,175,80,0.3);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:0.88rem;color:#81c784;text-align:center">
            </div>

            <!-- ── LOGIN SECTION ── -->
            <div id="login-section">
                <h2 class="login-title">Chào mừng trở lại 👋</h2>
                <p class="login-sub">Đăng nhập để quản lý lịch uống thuốc của bạn</p>
                <div
                    style="background:rgba(0,212,170,0.06);border:1px solid rgba(0,212,170,0.2);border-radius:10px;padding:12px;margin-bottom:20px;font-size:0.8rem">
                    <div style="color:var(--text-muted);margin-bottom:6px;font-weight:600">🔑 Tài khoản demo:</div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap">
                        <button onclick="fillDemo('admin','admin123')"
                            style="background:rgba(0,212,170,0.1);border:1px solid rgba(0,212,170,0.25);color:var(--primary);padding:4px 10px;border-radius:6px;font-size:0.78rem;cursor:pointer">👑
                            admin / admin123</button>
                        <button onclick="fillDemo('bsminh','123456')"
                            style="background:rgba(167,139,250,0.1);border:1px solid rgba(167,139,250,0.25);color:var(--accent2);padding:4px 10px;border-radius:6px;font-size:0.78rem;cursor:pointer">🩺
                            bsminh / 123456</button>
                        <button onclick="fillDemo('patient','patient123')"
                            style="background:rgba(255,107,157,0.1);border:1px solid rgba(255,107,157,0.25);color:var(--accent);padding:4px 10px;border-radius:6px;font-size:0.78rem;cursor:pointer">👤
                            patient / patient123</button>
                    </div>
                </div>
                <form id="login-form" novalidate>
                    <div class="form-group">
                        <label class="form-label-l">Tên đăng nhập</label>
                        <input type="text" class="form-input" id="username" placeholder="Nhập tên đăng nhập..."
                            autocomplete="username" />
                        <div class="error-msg" id="err-username"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label-l">Mật khẩu</label>
                        <input type="password" class="form-input" id="password" placeholder="Nhập mật khẩu..."
                            autocomplete="current-password" />
                        <div class="error-msg" id="err-password"></div>
                    </div>
                    <button type="submit" class="btn-login">Đăng nhập →</button>
                </form>
                <div class="divider">hoặc</div>
                <p style="text-align:center;font-size:0.88rem;color:var(--text-secondary)">Chưa có tài khoản? <span
                        class="toggle-link" onclick="switchToRegister()">Đăng ký ngay</span></p>
            </div>

            <!-- ── REGISTER SECTION ── -->
            <div id="register-section" style="display:none">
                <h2 class="login-title">Tạo tài khoản 🩺</h2>
                <p class="login-sub">Đăng ký để bắt đầu quản lý sức khỏe</p>
                <form id="register-form" novalidate>
                    <div class="form-group">
                        <label class="form-label-l">Họ và tên</label>
                        <input type="text" class="form-input" id="reg-name" placeholder="Nguyễn Văn A..." />
                        <div class="error-msg" id="err-reg-name"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label-l">Tên đăng nhập</label>
                        <input type="text" class="form-input" id="reg-username" placeholder="username..." />
                        <div class="error-msg" id="err-reg-user"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label-l">Mật khẩu</label>
                        <input type="password" class="form-input" id="reg-password" placeholder="Ít nhất 6 ký tự..." />
                        <div class="error-msg" id="err-reg-pass"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label-l">Xác nhận mật khẩu</label>
                        <input type="password" class="form-input" id="reg-password2"
                            placeholder="Nhập lại mật khẩu..." />
                        <div class="error-msg" id="err-reg-pass2"></div>
                    </div>
                    <button type="submit" class="btn-login">Đăng ký →</button>
                </form>
                <div class="divider">hoặc</div>
                <p style="text-align:center;font-size:0.88rem;color:var(--text-secondary)">Đã có tài khoản? <span
                        class="toggle-link" onclick="switchToLogin()">Đăng nhập</span></p>
            </div>
        </div>
        <a href="index.html" class="back-link">← Quay về trang chủ</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
