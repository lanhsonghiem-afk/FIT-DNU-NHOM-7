<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MedReminder</title>

    <link rel="stylesheet" href="css/stylelogin.css">
</head>

<body>

    <div class="login-wrapper">

        <div class="login-card">
            <div class="login-notice">
                🔐 Vui lòng đăng nhập để xem và quản lý lịch uống thuốc của bạn
            </div>

            <!-- ========== ĐĂNG NHẬP ========== -->
            <div id="loginSection">
                <h2>Đăng nhập MedReminder</h2>

                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" required placeholder="Nhập email">
                    </div>

                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <input type="password" required placeholder="Nhập mật khẩu">
                    </div>

                    <button type="submit">Đăng nhập</button>
                </form>

                <p class="register-text">
                    Chưa có tài khoản?
                    <span onclick="toggleRegister(true)">Tạo tài khoản</span>
                </p>
            </div>

            <!-- ========== ĐĂNG KÝ ========== -->
            <div id="registerSection" style="display:none;">
                <h2>Tạo tài khoản</h2>

                <form id="registerForm">
                    <div class="form-group">
                        <label>Tên tài khoản</label>
                        <input type="text" id="registerUsername" placeholder="Nhập tên tài khoản">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="registerEmail" placeholder="Nhập email">
                    </div>

                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <input type="password" id="registerPassword" placeholder="Nhập mật khẩu (ít nhất 6 ký tự)">
                    </div>

                    <div class="form-group">
                        <label>Xác nhận mật khẩu</label>
                        <input type="password" id="registerConfirm" placeholder="Nhập lại mật khẩu">
                    </div>

                    <button type="button" onclick="register()">Tạo tài khoản</button>
                </form>

                <p class="register-text">
                    Đã có tài khoản?
                    <span onclick="toggleRegister(false)">Đăng nhập</span>
                </p>
            </div>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
